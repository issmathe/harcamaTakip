<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Çevrimdışısınız · Bütçem</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; }
      main { max-width: 24rem; padding: 2rem; text-align: center; }
      h1 { color: #fff; font-size: 1.5rem; }
      p { line-height: 1.55; }
      button { border: 0; border-radius: .75rem; padding: .75rem 1rem; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı yok</h1>
      <p>Bütçem'e yeniden bağlanmak için internet bağlantınızı kontrol edin.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
